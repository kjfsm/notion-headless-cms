name: 機能要望
description: 新機能・改善の提案
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 課題
      description: 何ができない・何が不便かを具体的に
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: どう解決したいか。API 案があれば記載してください
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 現状の workaround や他ライブラリでの実現方法など
