name: Deploy docs site

# 公式ドキュメントサイト (apps/docs) を Cloudflare Workers にデプロイする。
# - main への push で本番デプロイ
# - PR / workflow_dispatch で --dry-run 確認
# Cloudflare GitHub App (Workers Builds) を併用するリポジトリでは workflow_dispatch のみ残し、
# `push` トリガを外しても良い。
on:
  push:
    branches:
      - main
    paths:
      - "apps/docs/**"
      - "docs/**"
      - "packages/**"
      - ".github/workflows/deploy-docs.yml"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "docs/**"
      - "packages/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "wrangler deploy --dry-run（実デプロイなし）"
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Cloudflare 認証情報 / NOTION_TOKEN は GitHub Environment 経由で投入する。
    # Settings > Environments で `docs-site` を作成し、Secrets に
    # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / NOTION_TOKEN / NOTION_WEBHOOK_SECRET を登録する。
    environment: docs-site
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: 依存関係のインストール
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: ワークスペースパッケージのビルド
        run: pnpm build

      - name: スキーマ生成 (nhc generate)
        working-directory: apps/docs
        run: pnpm generate
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: docs サイトのビルド
        working-directory: apps/docs
        run: pnpm build

      # PR では実デプロイせず dry-run、main push / dispatch で本番デプロイ。
      - name: Cloudflare Workers へデプロイ
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          command: ${{ (github.event_name == 'pull_request' || inputs.dry-run) && 'deploy --dry-run' || 'deploy' }}
          # ランタイム secret を Worker に同期（同値なら no-op）。
          secrets: |
            NOTION_TOKEN
            NOTION_WEBHOOK_SECRET
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_WEBHOOK_SECRET: ${{ secrets.NOTION_WEBHOOK_SECRET }}
