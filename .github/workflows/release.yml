name: Release Canary

# main への push (= feature PR のマージ) のたびに、Version Packages PR を経由せず
# pending changeset の内容から snapshot バージョン (0.0.0-canary-<sha>) を組み立てて
# `canary` dist-tag で npm publish する。
#
# - pending changeset を消費・削除しない (次の正式リリース判断のためにそのまま残す)
# - Version PR も git tag も作らないため RELEASE_PAT は不要 (default token で足りる)
# - 正式な latest リリースは release-stable.yml (workflow_dispatch) に分離した
on:
  push:
    branches:
      - main

concurrency:
  # release-stable.yml と同じグループ名にして直列化する (Version PR マージ時に
  # canary の no-op publish と stable の latest publish が競合しないようにするため)
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # snapshot バージョン名の {commit} 解決に必要
          fetch-depth: 0

      # pnpm のバージョンは package.json の packageManager フィールドから自動検出させる
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      # CI でビルド済みの turbo キャッシュを引き継いで高速化
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-refs/heads/main-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-refs/heads/main-

      - run: pnpm install --frozen-lockfile --prefer-offline
      # publish 時に dist が必要なので build のみ実施。typecheck / test は CI で通過済み前提
      - run: pnpm turbo build --filter="./packages/*"

      # pending changeset が 0 件なら version:snapshot は何もバンプせず、
      # 後続の release:snapshot も publish 対象なしで no-op 終了する (安全)
      - run: pnpm version:snapshot
      - name: canary タグで npm 公開
        run: pnpm release:snapshot
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance を有効化（permissions.id-token: write と連動）
          NPM_CONFIG_PROVENANCE: "true"
