name = "nhc-docs-site"
main = "./workers/app.ts"
compatibility_date = "2026-04-22"
compatibility_flags = ["nodejs_compat"]

# /docs 配下は react-router.config.ts の prerender で静的 HTML を出力する。
# Cloudflare Workers の static assets が `build/client/docs/**/index.html` を
# 直接配信し、見つからない URL（/, /:slug, /api/*）だけ main の Worker（SSR）へ
# フォールバックさせるための設定。
# - html_handling = "auto-trailing-slash": /docs → /docs/index.html を解決
# - not_found_handling = "none": 該当ファイル無しは Worker SSR に流す
[assets]
directory = "./build/client"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

# Workers の組み込み観測機能を有効化（ダッシュボードでログ・メトリクスを閲覧可能）
[observability]
enabled = true

[secrets]
required = ["NOTION_TOKEN"]

# デプロイは Cloudflare GitHub App (Workers Builds) を使う。
# ビルドコマンド / Root directory / 環境変数 / シークレットは Cloudflare ダッシュボード側で設定する。
# 詳細は `apps/docs/README.md` の「Cloudflare Workers Builds セットアップ」を参照。
# (ローカル `vite build` 経由では [build] セクションは無視されるため、ここには書かない。)

# KV namespace は v3 移行に伴い必須になった。デプロイ前に実際の namespace を作成し、
# id を差し替えること: wrangler kv namespace create DOC_CACHE
[[kv_namespaces]]
binding = "DOC_CACHE"
id = "REPLACE_WITH_REAL_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "IMG_BUCKET"
bucket_name = "nhc-docs-site-cache"
preview_bucket_name = "nhc-docs-site-cache-preview"

# Notion アクセスを直列化する同期エンジン（SyncCoordinatorDO、workers/sync-coordinator-do.ts）。
# 読者リクエストは KV/R2 を読むだけで、Notion API 呼び出しは DO に一元化する。
[[durable_objects.bindings]]
name = "SYNC_COORDINATOR"
class_name = "SyncCoordinatorDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncCoordinatorDO"]

# シークレットは Cloudflare ダッシュボード (Workers > Settings > Variables and Secrets) から登録する:
# - NOTION_TOKEN
# - NOTION_WEBHOOK_SECRET  # POST /api/cms/webhook を有効化する場合のみ
# KV / R2 バインディングは wrangler kv namespace create / wrangler r2 bucket create で作成する
