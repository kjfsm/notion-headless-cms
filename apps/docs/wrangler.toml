name = "nhc-docs-site"
main = "./workers/app.ts"
compatibility_date = "2026-04-22"
compatibility_flags = ["nodejs_compat"]
assets = { directory = "./build/client" }

# Workers の組み込み観測機能を有効化（ダッシュボードでログ・メトリクスを閲覧可能）
[observability]
enabled = true

# デプロイは Cloudflare GitHub App (Workers Builds) を使う。
# ビルドコマンド / Root directory / 環境変数 / シークレットは Cloudflare ダッシュボード側で設定する。
# 詳細は `apps/docs/README.md` の「Cloudflare Workers Builds セットアップ」を参照。
# (ローカル `vite build` 経由では [build] セクションは無視されるため、ここには書かない。)

# KV namespace は初回デプロイ前に作成して ID を設定してください:
# wrangler kv namespace create DOC_CACHE
# [[kv_namespaces]]
# binding = "DOC_CACHE"
# id = "<KV_NAMESPACE_ID>"

[[r2_buckets]]
binding = "IMG_BUCKET"
bucket_name = "nhc-docs-site-cache"
preview_bucket_name = "nhc-docs-site-cache-preview"

# シークレットは Cloudflare ダッシュボード (Workers > Settings > Variables and Secrets) から登録する:
# - NOTION_TOKEN
# - NOTION_WEBHOOK_SECRET  # /api/revalidate を有効化する場合のみ
# KV / R2 バインディングは wrangler kv namespace create / wrangler r2 bucket create で作成する
