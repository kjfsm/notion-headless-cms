name = "nhc-example-cloudflare-astro"
compatibility_date = "2026-04-22"
compatibility_flags = ["nodejs_compat"]

# main / assets は @astrojs/cloudflare アダプタが build 時に
# .wrangler/deploy/config.json を生成して引き継ぐため、ここでは指定しない。

# Workers の組み込み観測機能を有効化（ダッシュボードでログ・メトリクスを閲覧可能）
[observability]
enabled = true

[build]
command = "pnpm build"

[secrets]
required = ["NOTION_TOKEN"]

[[d1_databases]]
binding = "DB"
database_name = "nhc-example-cloudflare-astro"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# @astrojs/cloudflare 13.3.x がセッション KV を自動追加するため、
# 先に宣言して id なし（wrangler が自動プロビジョニング）にする。
[[kv_namespaces]]
binding = "SESSION"

[[r2_buckets]]
binding = "IMG_BUCKET"
bucket_name = "nhc-example-cache"

# wrangler secret put NOTION_TOKEN
# D1 / R2 バインディングは wrangler d1 create / wrangler r2 bucket create で作成する
