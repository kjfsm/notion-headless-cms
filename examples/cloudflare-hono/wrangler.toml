name = "nhc-example-cloudflare-hono"
main = "src/index.ts"
compatibility_date = "2026-04-22"
compatibility_flags = ["nodejs_compat"]

# Workers の組み込み観測機能を有効化（ダッシュボードでログ・メトリクスを閲覧可能）
[observability]
enabled = true

[build]
command = "pnpm build"

[secrets]
required = ["NOTION_TOKEN"]

[[d1_databases]]
binding = "DB"
database_name = "nhc-example-cloudflare-hono"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "IMG_BUCKET"
bucket_name = "nhc-example-cache"
preview_bucket_name = "nhc-example-cache-preview"

# v3: Notion アクセスを直列化する同期エンジン（SyncCoordinatorDO）。
# 読者リクエストは KV/R2 を読むだけで、Notion API 呼び出しは DO に一元化する。
[[durable_objects.bindings]]
name = "SYNC_COORDINATOR"
class_name = "SyncCoordinatorDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncCoordinatorDO"]

# シークレットは wrangler secret put で設定する
# wrangler secret put NOTION_TOKEN
# D1 / R2 バインディングは wrangler d1 create / wrangler r2 bucket create で作成する
