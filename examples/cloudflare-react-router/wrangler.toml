name = "nhc-example-cloudflare-react-router"
main = "./workers/app.ts"
compatibility_date = "2026-04-22"
compatibility_flags = ["nodejs_compat"]
assets = { directory = "./build/client" }

# Workers の組み込み観測機能を有効化（ダッシュボードでログ・メトリクスを閲覧可能）
[observability]
enabled = true

[build]
command = "pnpm build"

[secrets]
required = ["NOTION_TOKEN"]

[[d1_databases]]
binding = "DB"
database_name = "nhc-example-cloudflare-react-router"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "IMG_BUCKET"
bucket_name = "nhc-example-cache"
preview_bucket_name = "nhc-example-cache-preview"

# ランタイムシークレットは初回デプロイ前に以下で設定してください:
# wrangler secret put NOTION_TOKEN
# D1 / R2 バインディングは wrangler d1 create / wrangler r2 bucket create で作成する
